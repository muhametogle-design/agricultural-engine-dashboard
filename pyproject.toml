[project]
name = "agri-dss"
version = "0.4.0"
description = "Agricultural Spatial DSS - well siting, crop matching, irrigation scheduling, and infrastructure"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
