<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Agri-DSS Console</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root{--bg:#0e1512;--panel:#16211c;--panel2:#1d2b24;--line:#2a3a31;--txt:#dbe7df;
        --dim:#8fa79a;--acc:#5fd08a;--blue:#3fa9f5;--warn:#f5c46a;--bad:#f57c7c;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);
    color:var(--txt);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);
    border-bottom:1px solid var(--line)}
  header b{color:var(--acc)} header .sp{flex:1}
  #whois{color:var(--dim);font-size:12px}
  main{flex:1;display:flex;min-height:0}
  #side{width:390px;min-width:390px;overflow-y:auto;padding:12px;background:var(--panel);
    border-right:1px solid var(--line)}
  #map{flex:1;min-width:0}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim)}
  label{display:block;font-size:12px;color:var(--dim);margin:6px 0 2px}
  input,select{width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);
    background:#0f1714;color:var(--txt)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
  .scroll-x{overflow-x:auto}
  .action-irrigate{color:var(--warn);font-weight:700}
  .action-rain_sufficient{color:var(--acc)}
  .action-data_gap{color:var(--bad)}
  button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:7px 10px;
    background:#22352b;color:var(--txt);margin:4px 4px 0 0;font-weight:600;font-size:12.5px}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);color:#0b120e;border-color:var(--acc)}
  button.blue{background:var(--blue);color:#0b120e;border-color:var(--blue)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
  #log{font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:pre-wrap;
    max-height:150px;overflow-y:auto;color:#9fc3ad;background:#0b120e;border-radius:8px;padding:8px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--dim);font-weight:600}
  .chip{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:#24352c;color:var(--acc)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
  .kv b{color:var(--acc);text-align:right}
  .err{color:var(--bad)}
  .mode-active{outline:2px solid var(--acc)}
  #legend span{vertical-align:middle}
</style>
</head>
<body>
<header>
  <b>Agri-DSS</b><span>Agricultural Spatial Decision Console</span>
  <span class="sp"></span><span id="whois">not signed in</span>
</header>
<main>
  <div id="side">
    <div class="card">
      <h3>1 · Sign in</h3>
      <label>Email</label><input id="email" value="demo@agri-dss.app"/>
      <label>Password</label><input id="password" type="password" value="demo-pass-2026"/>
      <label>API base <span style="color:var(--dim)">(only if you opened this file from disk — leave blank when served at /console)</span></label>
      <input id="api-base" placeholder="https://8000-….e2b.app  or  http://localhost:8000"
             oninput="setApiBase(this.value)"/>
      <button class="primary" id="login-btn" onclick="login()">Sign in</button>
      <span id="auth-chip" class="chip" style="display:none"></span>
    </div>

    <div class="card">
      <h3>2 · Field</h3>
      <div class="row">
        <button class="needs-auth" disabled onclick="loadDemoField()">Load demo field</button>
        <button class="needs-auth" disabled id="mode-point" onclick="setMode('point')">Tap GPS point</button>
        <button class="needs-auth" disabled id="mode-draw" onclick="setMode('draw')">Draw boundary</button>
        <button id="finish-btn" style="display:none" onclick="finishDraw()">Finish polygon ⏎</button>
      </div>
      <label>Field name</label><input id="field-name" value="Console shamba"/>
      <label>Point-mode size (ha)</label><input id="point-area" type="number" value="1" step="0.5" min="0.1"/>
      <div id="field-info" class="mono" style="margin-top:8px;color:var(--dim)">no field selected</div>
    </div>

    <div class="card">
      <h3>3 · Data</h3>
      <div class="row">
        <button class="needs-field blue" disabled onclick="ingestEnv()">Ingest environment</button>
        <button class="needs-field" disabled onclick="addDemoVes()">Add demo VES ×3</button>
      </div>
      <div id="env-info" class="kv" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h3>4 · Live irrigation advisory</h3>
      <div class="grid2">
        <div><label>Crop</label>
          <select id="irrigation-crop">
            <option>maize</option><option selected>sorghum</option><option>pearl_millet</option>
            <option>cowpea</option><option>mung_bean</option><option>groundnut</option>
            <option>sesame</option><option>tomato</option><option>onion</option>
            <option>watermelon</option><option>banana</option><option>mango</option>
            <option>date_palm</option>
          </select>
        </div>
        <div><label>Growth stage</label>
          <select id="growth-stage">
            <option>initial</option><option>development</option>
            <option selected>mid_season</option><option>late_season</option>
          </select>
        </div>
        <div><label>System efficiency (%)</label>
          <input id="irrigation-efficiency" type="number" value="85" min="30" max="100" step="1"/>
        </div>
        <div><label>Trigger deficit (mm)</label>
          <input id="depletion-trigger" type="number" value="20" min="1" max="200" step="1"/>
        </div>
        <div><label>Current deficit (mm)</label>
          <input id="initial-deficit" type="number" value="0" min="0" max="300" step="1"/>
        </div>
        <div><label>Pump flow (m³/hour)</label>
          <input id="pump-flow" type="number" value="40" min="0.1" step="1"/>
        </div>
      </div>
      <div class="row">
        <button id="irrigation-btn" class="blue needs-field" disabled onclick="runIrrigation()">☁ Build 7-day schedule</button>
      </div>
      <div id="irrigation-info" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h3>5 · Complete decision plan</h3>
      <label>Supplemental irrigation scenario (mm/yr)</label>
      <input id="irrigation" type="number" value="600" step="50" min="0"/>
      <div class="row">
        <button class="primary needs-field" disabled onclick="runPlan()">⚡ Run + persist master plan</button>
      </div>
      <div id="plan-info" style="margin-top:8px"></div>
    </div>

    <div class="card"><h3>Log</h3><div id="log"></div></div>
  </div>
  <div id="map"></div>
</main>

<script>
"use strict";
let apiBase = (localStorage.getItem("agri_api_base") || "").replace(/\/+$/, "");
function setApiBase(v){
  let s = (v || "").trim().replace(/\/+$/, "");
  try { s = new URL(s).origin; } catch {}   // accept pasted …/console links -> keep just the origin
  apiBase = s;
  localStorage.setItem("agri_api_base", s);
}
const apiBaseInput = document.getElementById("api-base");
if (apiBaseInput && apiBase) apiBaseInput.value = apiBase;
let token = null;
let me = null;
let field = null;          // current field object
let demoClientId = null;   // client created lazily for new fields
let mode = null;           // 'point' | 'draw' | null
let drawRing = [];         // [[lat,lon],...]
let drawLayer = null, fieldLayer = null, zonesLayer = null, marksLayer = null;

/* ---------------- map ---------------- */
const map = L.map("map").setView([2.046, 45.318], 15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom: 19, attribution: "&copy; OpenStreetMap"}).addTo(map);
zonesLayer = L.layerGroup().addTo(map);
marksLayer = L.layerGroup().addTo(map);

/* ---------------- helpers ---------------- */
function log(msg, cls){ const el = document.getElementById("log");
  const line = document.createElement("div"); if (cls) line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.prepend(line); }
async function call(path, {method="GET", body=null} = {}){
  const headers = {"Accept": "application/json"};
  if (token) headers["Authorization"] = `Bearer ${token}`;
  if (body !== null) headers["Content-Type"] = "application/json";
  const r = await fetch(apiBase + "/api/v1" + path, {method, headers, body: body ? JSON.stringify(body) : null});
  const text = await r.text();
  let data; try { data = JSON.parse(text); } catch { data = {detail: text}; }
  if (!r.ok) throw Object.assign(new Error(data.detail || r.statusText), {status: r.status, data});
  return data;
}
function setDisabled(sel, off){ document.querySelectorAll(sel).forEach(b => b.disabled = off); }
const fmt = (v, u="") => v === null || v === undefined ? "—" : `${typeof v === "number" ? v.toLocaleString() : v}${u}`;

/* ---------------- auth ---------------- */
async function login(){
  const btn = document.getElementById("login-btn"); btn.disabled = true;
  log(`POST ${(apiBase || location.origin)}/api/v1/auth/login`);
  if (!apiBase && !location.protocol.startsWith("http"))
    log("no API base set and this page isn't served over http — put the API's origin in the API base box first", "err");
  try{
    const r = await call("/auth/login", {method: "POST",
      body: {email: email.value, password: password.value}});
    token = r.access_token; me = r.user;
    document.getElementById("whois").textContent = `${me.full_name} · ${me.role}`;
    const chip = document.getElementById("auth-chip");
    chip.style.display = "inline-block"; chip.textContent = "authenticated";
    setDisabled(".needs-auth", false);
    log(`signed in as ${me.email}`);
    loadIrrigationCatalog();
  }catch(e){
    if (e.status === 405 || e.status === 404)
      log("server didn't recognize POST there — fill the API base box with the API's origin (e.g. https://8000-….e2b.app)", "err");
    log(`login failed: ${e.message}`, "err");
  }
  btn.disabled = false;
}
async function loadIrrigationCatalog(){
  try{
    const catalog = await call("/irrigation/crops");
    const cropSelect = document.getElementById("irrigation-crop");
    const stageSelect = document.getElementById("growth-stage");
    const previousCrop = cropSelect.value || "sorghum";
    const previousStage = stageSelect.value || "mid_season";
    const fill = (select, values) => select.replaceChildren(...values.map(v => {
      const option = document.createElement("option"); option.value = v;
      option.textContent = v.replaceAll("_", " "); return option;
    }));
    fill(cropSelect, catalog.crops); fill(stageSelect, catalog.growth_stages);
    cropSelect.value = catalog.crops.includes(previousCrop) ? previousCrop : catalog.crops[0];
    stageSelect.value = catalog.growth_stages.includes(previousStage) ? previousStage : catalog.growth_stages[0];
  }catch(e){ log(`using built-in irrigation catalog: ${e.message}`, "err"); }
}

/* ---------------- field lifecycle ---------------- */
async function ensureClient(){
  if (demoClientId) return demoClientId;
  const r = await call("/clients", {method: "POST",
    body: {full_name: "Console Operator", phone: null, email: null}});
  demoClientId = r.id; log(`client created: ${r.id.slice(0,8)}`);
  return demoClientId;
}
async function loadDemoField(){
  try{
    const fields = await call("/fields");
    if (!fields.length){ log("no fields in this tenant yet"); return; }
    field = fields[0];
    showField(); log(`loaded field '${field.field_name}' (${field.area_hectares} ha)`);
  }catch(e){ log(e.message, "err"); }
}
function showField(){
  document.getElementById("field-info").innerHTML =
    `${field.field_name}<br>${field.area_hectares} ha · ${field.perimeter_meters} m<br>` +
    `<span title="${field.id}">id ${String(field.id).slice(0,8)}…</span>`;
  // Never leave a previous field's diagnostics visible under a newly selected boundary.
  document.getElementById("env-info").innerHTML = "";
  document.getElementById("irrigation-info").innerHTML = "";
  document.getElementById("plan-info").innerHTML = "";
  marksLayer.clearLayers(); zonesLayer.clearLayers();
  if (fieldLayer) fieldLayer.remove();
  fieldLayer = L.geoJSON(field.boundary, {color: "#5fd08a", weight: 2, fillOpacity: 0.08}).addTo(map);
  map.fitBounds(fieldLayer.getBounds().pad(0.25));
  setDisabled(".needs-field", false);
}
async function createField(geojson){
  const clientId = await ensureClient();
  const input = geojson ? {mode: "polygon", geometry: geojson}
                        : {mode: "point", lon: geojsonPoint.lon, lat: geojsonPoint.lat,
                           area_ha: parseFloat(document.getElementById("point-area").value)};
  field = await call("/fields", {method: "POST",
    body: {client_id: clientId, field_name: document.getElementById("field-name").value, input}});
  showField();
  log(`field registered: ${field.area_hectares} ha, perimeter ${field.perimeter_meters} m`);
}

let geojsonPoint = null;
function setMode(m){
  mode = m; drawRing = [];
  if (drawLayer){ drawLayer.remove(); drawLayer = null; }
  document.getElementById("mode-point").classList.toggle("mode-active", m === "point");
  document.getElementById("mode-draw").classList.toggle("mode-active", m === "draw");
  document.getElementById("finish-btn").style.display = m === "draw" ? "inline-block" : "none";
  log(m === "point" ? "tap the map once to place the field" :
                      "click to add vertices, then 'Finish polygon'");
}
map.on("click", async (e) => {
  if (mode === "point"){
    geojsonPoint = {lon: e.latlng.lng, lat: e.latlng.lat};
    try{ await createField(null); }catch(err){ log(err.message, "err"); }
    setMode(null);
  } else if (mode === "draw"){
    drawRing.push([e.latlng.lat, e.latlng.lng]);
    if (drawLayer) drawLayer.remove();
    drawLayer = L.polyline(drawRing, {color: "#f5c46a", dashArray: "6 6"}).addTo(map);
    L.circleMarker(e.latlng, {radius: 4, color: "#f5c46a"}).addTo(map);
  }
});
async function finishDraw(){
  if (drawRing.length < 3){ log("need at least 3 vertices", "err"); return; }
  const ring = drawRing.map(p => [p[1], p[0]]); ring.push(ring[0]);    // lon,lat + close
  try{ await createField({type: "Polygon", coordinates: [ring]}); }
  catch(err){ log(err.message, "err"); }
  setMode(null);
}

/* ---------------- data ingestion ---------------- */
async function ingestEnv(){
  if (!field) return;
  log("querying SoilGrids + NASA POWER …");
  try{
    const r = await call(`/fields/${field.id}/environmental?refresh=true`, {method: "POST"});
    document.getElementById("env-info").innerHTML =
      `<span>rainfall</span><b>${fmt(r.avg_annual_rainfall_mm, " mm/yr")}</b>` +
      `<span>mean temp</span><b>${fmt(r.avg_temp_celsius, " °C")}</b>` +
      `<span>ET0 (FAO-56)</span><b>${fmt(r.annual_et0_mm, " mm/yr")}</b>` +
      `<span>soil pH</span><b>${fmt(r.ph_water)}</b>` +
      `<span>clay</span><b>${fmt(r.clay_percentage, " %")}</b>` +
      `<span>SOC</span><b>${fmt(r.soil_organic_carbon, " g/kg")}</b>` +
      `<span>sources</span><b>${(r.data_sources || []).length} APIs</b>`;
    log(`environmental cached (${(r.data_sources || []).join(" + ") || "cache"})`);
  }catch(e){ log(e.message, "err"); }
}
async function addDemoVes(){
  if (!field) return;
  const D = [2, 5, 10, 20, 40, 80];
  const c = field.center_point.coordinates;
  const curves = [
    {lon: c[0]+0.0004, lat: c[1]+0.0003, rho: [800, 600, 400, 200, 40, 25]},
    {lon: c[0]-0.0006, lat: c[1]-0.0004, rho: [300, 220, 150, 90, 55, 30]},
    {lon: c[0]-0.0010, lat: c[1]+0.0006, rho: [900, 1200, 1500, 1800, 2200, 2600]},
  ];
  try{
    const r = await call(`/fields/${field.id}/ves/bulk`, {method: "POST",
      body: {surveys: curves.map(s => ({lon: s.lon, lat: s.lat, depth_layers_m: D,
        apparent_resistivity_ohmm: s.rho, operator_notes: "console demo sounding"}))}});
    r.forEach(v => {
      L.circleMarker([v.lat, v.lon], {radius: 6, color: "#3fa9f5", weight: 2})
        .bindTooltip(`VES score ${v.aquifer_quality_score}` +
          (v.estimated_water_table_depth_m ? ` · WT ${v.estimated_water_table_depth_m} m` : ""))
        .addTo(marksLayer);
    });
    log(`ingested ${r.length} soundings; best score ${Math.max(...r.map(v => v.aquifer_quality_score))}`);
  }catch(e){ log(e.message, "err"); }
}

/* ---------------- live irrigation advisory ---------------- */
function irrigationRequest(){
  const pump = parseFloat(document.getElementById("pump-flow").value);
  return {
    crop: document.getElementById("irrigation-crop").value,
    growth_stage: document.getElementById("growth-stage").value,
    forecast_days: 7,
    irrigation_efficiency: parseFloat(document.getElementById("irrigation-efficiency").value) / 100,
    management_allowed_depletion_mm: parseFloat(document.getElementById("depletion-trigger").value),
    initial_soil_water_deficit_mm: parseFloat(document.getElementById("initial-deficit").value),
    pump_flow_m3_per_hour: Number.isFinite(pump) && pump > 0 ? pump : null,
  };
}
async function runIrrigation(){
  if (!field) return;
  const btn = document.getElementById("irrigation-btn"); btn.disabled = true;
  const requestedFieldId = field.id;
  log("fetching Open-Meteo forecast and building field water balance …");
  try{
    const advisory = await call(`/fields/${requestedFieldId}/irrigation-advisory`, {
      method: "POST", body: irrigationRequest()});
    if (!field || field.id !== requestedFieldId){ log("discarded advisory for a field no longer selected"); return; }
    renderIrrigation(advisory);
    log(`irrigation advisory ready — ${advisory.summary.irrigation_events} event(s), ` +
        `${advisory.summary.total_irrigation_volume_m3} m³`);
  }catch(e){
    renderIrrigation(null);
    log(`irrigation advisory failed: ${e.message}`, "err");
  }finally{ btn.disabled = false; }
}
function renderIrrigation(a){
  const target = document.getElementById("irrigation-info");
  if (!a){ target.innerHTML = '<p class="err mono">Live forecast unavailable; the rest of the plan remains valid.</p>'; return; }
  const s = a.summary;
  const days = (a.schedule || []).map(d => `<tr>
    <td>${String(d.date).slice(5)}</td><td>${fmt(d.precipitation_mm)}</td>
    <td>${fmt(d.crop_et_mm)}</td><td>${fmt(d.gross_irrigation_mm)}</td>
    <td>${fmt(d.irrigation_volume_m3)}</td><td>${fmt(d.pump_hours)}</td>
    <td class="action-${d.action}" title="${(d.risk_flags || []).join(", ")}">
      ${d.action.replaceAll("_", " ")}${(d.risk_flags || []).length ? " ⚠" : ""}</td></tr>`).join("");
  target.innerHTML = `
    <div class="kv" style="margin-bottom:7px">
      <span>Kc · stage</span><b>${a.crop_coefficient} · ${a.growth_stage.replaceAll("_", " ")}</b>
      <span>forecast rain</span><b>${s.total_forecast_rain_mm} mm</b>
      <span>crop demand</span><b>${s.total_crop_water_demand_mm} mm</b>
      <span>scheduled water</span><b>${s.total_irrigation_volume_m3} m³ · ${s.irrigation_events} event(s)</b>
      <span>peak pump runtime</span><b>${s.peak_daily_pump_hours == null ? "—" : s.peak_daily_pump_hours + " h/day"}</b>
      <span>forecast source</span><b>${a.source.provider} · ${a.source.timezone}</b>
    </div>
    <div class="scroll-x"><table><tr><th>day</th><th>rain mm</th><th>ETc mm</th><th>gross mm</th><th>m³</th><th>pump h</th><th>action</th></tr>${days}</table></div>
    <p style="font-size:12px;color:var(--warn)">${s.recommendation}</p>` +
    ((a.warnings || []).length ? `<p class="err mono">${a.warnings.join(" · ")}</p>` : "");
}

/* ---------------- master plan ---------------- */
const ZONE_COLORS = {homestead: "#f5c46a", orchard: "#7ec96e", roads_service: "#8fa79a",
                     production: "#3fa9f5", well_site: "#f57c7c"};
async function runPlan(){
  if (!field) return;
  log("running decision pipeline (ingest → engines → persist) …");
  try{
    const p = await call(`/fields/${field.id}/master-plan`, {method: "POST",
      body: {
        supplemental_irrigation_mm: parseFloat(document.getElementById("irrigation").value),
        irrigation_advisory: irrigationRequest(),
      }});
    renderPlan(p);
    renderIrrigation(p.irrigation_advisory || null);
    log(`plan ${String(p.plan_id).slice(0,8)} ready — well score ${p.well_siting ? p.well_siting.composite_score : "—"}`);
  }catch(e){ log(e.message, "err"); }
}
function renderPlan(p){
  marksLayer.clearLayers(); zonesLayer.clearLayers();
  // zones
  if (p.layout_zones){
    p.layout_zones.features.forEach(z => {
      const color = ZONE_COLORS[z.properties.zone] || "#ccc";
      L.geoJSON(z, {style: {color, weight: 1.5, fillOpacity: 0.22}})
        .bindTooltip(`${z.properties.zone} · ${z.properties.area_ha} ha`).addTo(zonesLayer);
    });
  }
  // well
  const ws = p.well_siting;
  if (ws && ws.optimal_well_point){
    const [lon, lat] = ws.optimal_well_point.coordinates;
    L.marker([lat, lon]).addTo(marksLayer)
      .bindPopup(`<b>Optimal well</b><br>score ${ws.composite_score}<br>drill ${ws.recommended_drilling_depth_m} m`);
    (ws.candidate_sites || []).slice(1).forEach(s => {
      L.circleMarker([s.lat, s.lon], {radius: 5, color: "#f5c46a", weight: 2, dashArray: "3 3"})
        .bindTooltip(`candidate ${s.composite_score}`).addTo(marksLayer);
    });
  }
  // panel
  const crops = (p.crop_matching || []).slice(0, 6)
    .map(c => `<tr><td>${c.crop.replaceAll("_", " ")}</td><td>${c.score}</td><td>${c.rating.replaceAll("_", " ")}</td></tr>`)
    .join("");
  const f = p.fencing;
  document.getElementById("plan-info").innerHTML = `
    <div class="kv" style="margin-bottom:8px">
      <span>well score</span><b>${ws ? ws.composite_score : "—"}</b>
      <span>drill depth</span><b>${ws ? ws.recommended_drilling_depth_m + " m" : "—"}</b>
      <span>fencing</span><b>${f.total_posts} posts · ${f.wire_rolls} rolls · $${f.total_cost}</b>
      <span>irrigation forecast</span><b>${p.irrigation_advisory ? p.irrigation_advisory.summary.total_irrigation_volume_m3 + " m³" : "unavailable"}</b>
      <span>zones</span><b>${p.layout_zones ? p.layout_zones.features.length : 0}</b>
    </div>
    <table><tr><th>crop</th><th>score</th><th>rating</th></tr>${crops}</table>` +
    (p.warnings.length ? `<p class="err mono">${p.warnings.join(" · ")}</p>` : "");
}
</script>
</body>
</html>
